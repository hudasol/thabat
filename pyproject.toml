[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thabat-kit"
version = "0.1.0"
description = "A small reproducibility harness: seeding, numerical environment capture, paired seed runs, intervals and a prediction scorer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Huda Mueen" }]
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.7"]

[project.optional-dependencies]
torch = ["torch>=2.2"]
study = ["torch>=2.2", "gymnasium>=1.0", "mujoco>=3.1"]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
